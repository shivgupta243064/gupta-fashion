<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Gupta Fashion - Admin Panel</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    margin:0;
    background:#f5f7fb;
    font-family:Arial,sans-serif;
    color:#111827;
}

.admin-page{
    max-width:1250px;
    margin:30px auto;
    padding:20px;
}

.admin-header{
    background:#111827;
    color:white;
    padding:25px;
    border-radius:20px;

    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.admin-header h1{
    margin:0 0 5px;
}

.admin-header p{
    margin:0;
    color:#d1d5db;
}

.admin-header a{
    background:#f59e0b;
    color:#111827;
    padding:12px 18px;
    border-radius:10px;
    text-decoration:none;
    font-weight:bold;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin:20px 0;
}

.stat-card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:16px;
    padding:22px;
}

.stat-card small{
    color:#6b7280;
}

.stat-card h2{
    margin-top:8px;
}

.orders-box{
    background:white;
    border-radius:18px;
    padding:20px;
    border:1px solid #e5e7eb;
    overflow:auto;
}

table{
    width:100%;
    min-width:1000px;
    border-collapse:collapse;
}

th,td{
    padding:13px;
    border-bottom:1px solid #e5e7eb;
    text-align:left;
    font-size:13px;
    vertical-align:top;
}

select{
    padding:9px;
    border-radius:8px;
    border:1px solid #ddd;
}

.wa{
    color:#16a34a;
    font-weight:bold;
    text-decoration:none;
}

.delete{
    border:0;
    background:#fee2e2;
    color:#dc2626;
    padding:8px 10px;
    border-radius:8px;
    cursor:pointer;
}

.delete:active{
    transform:scale(.95);
}

.refresh{
    border:0;
    background:#111827;
    color:white;
    padding:10px 15px;
    border-radius:9px;
    cursor:pointer;
    margin-bottom:15px;
}

.empty{
    text-align:center;
    padding:40px;
    color:#6b7280;
}

.error{
    color:#dc2626;
    padding:20px;
    text-align:center;
}

@media(max-width:700px){

    .admin-page{
        margin:10px auto;
        padding:10px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .admin-header{
        flex-direction:column;
        align-items:flex-start;
    }

}

</style>

</head>

<body>

<div class="admin-page">

<div class="admin-header">

<div>

<h1>📊 Gupta Fashion</h1>

<p>Admin Panel</p>

</div>

<a href="index.html">
← Customer Website
</a>

</div>


<div class="stats">

<div class="stat-card">

<small>
Total Products
</small>

<h2 id="productCount">
8
</h2>

</div>


<div class="stat-card">

<small>
Total Orders
</small>

<h2 id="orderCount">
0
</h2>

</div>


<div class="stat-card">

<small>
Total Sales
</small>

<h2 id="sales">
₹0
</h2>

</div>

</div>


<div class="orders-box">

<h2>
📦 Customer Orders
</h2>

<button
class="refresh"
onclick="showOrders()"
>
↻ Refresh Orders
</button>


<table>

<thead>

<tr>

<th>
Order ID
</th>

<th>
Customer
</th>

<th>
Products
</th>

<th>
Total
</th>

<th>
Payment
</th>

<th>
Status
</th>

<th>
WhatsApp
</th>

<th>
Delete
</th>

</tr>

</thead>


<tbody id="orders">

<tr>

<td colspan="8">

<div class="empty">
Loading orders...
</div>

</td>

</tr>

</tbody>

</table>

</div>

</div>


<script>

/* =====================================================
SUPABASE
===================================================== */

const SUPABASE_URL =
"https://fglsyjbprzitagtfwgpp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_cdpN6qM5gHiHAzigyYgzfg_AU-Ce_3D";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =====================================================
STATUSES
===================================================== */

const statuses = [

"New Order",

"Confirmed",

"Packed",

"Out for Delivery",

"Delivered"

];


/* =====================================================
MONEY
===================================================== */

function money(n){

return "₹" +
Number(n || 0)
.toLocaleString("en-IN");

}


/* =====================================================
LOAD ORDERS
===================================================== */

async function getOrders(){

const {
data,
error
} = await supabaseClient

.from("orders")

.select("*")

.order(
"created_at",
{
ascending:false
}
);


if(error){

console.error(error);

return [];

}

return data || [];

}


/* =====================================================
SHOW ORDERS
===================================================== */

async function showOrders(){

const table =
document.getElementById("orders");

table.innerHTML = `

<tr>

<td colspan="8">

<div class="empty">
Loading orders...
</div>

</td>

</tr>

`;


const orders =
await getOrders();


document.getElementById(
"orderCount"
).textContent =
orders.length;


let sales=0;


orders.forEach(
order=>{

sales +=
Number(order.total || 0);

}
);


document.getElementById(
"sales"
).textContent =
money(sales);


if(!orders.length){

table.innerHTML = `

<tr>

<td colspan="8">

<div class="empty">

📦

<br><br>

No orders yet.

</div>

</td>

</tr>

`;

return;

}


table.innerHTML =

orders.map(
order=>{

let items = [];

try{

items =
Array.isArray(order.items)
? order.items
: [];

}catch(e){

items=[];

}


return `

<tr>

<td>

<b>
${escapeHtml(order.order_id || "")}
</b>

<br>

<small>
${formatDate(order.created_at)}
</small>

</td>


<td>

<b>
${escapeHtml(order.customer_name || "")}
</b>

<br>

📞 ${escapeHtml(order.customer_phone || "")}

<br>

${escapeHtml(order.customer_address || "")}

<br>

${escapeHtml(order.customer_city || "")},
${escapeHtml(order.customer_state || "")}
-
${escapeHtml(order.customer_pincode || "")}

</td>


<td>

${
items.length

?

items.map(
item=>

`${escapeHtml(item.name || "")}
× ${Number(item.qty || 0)}`

).join("<br>")

:

"No products"

}

</td>


<td>

<b>
${money(order.total)}
</b>

</td>


<td>

<span>

Cash on Delivery

</span>

</td>


<td>

<select
onchange="changeStatus('${order.id}',this.value)"
>

${
statuses.map(
status=>`

<option
value="${status}"
${
order.status === status
? "selected"
: ""
}
>

${status}

</option>

`
).join("")
}

</select>

</td>


<td>

<a

class="wa"

target="_blank"

href="https://wa.me/91${encodeURIComponent(
order.customer_phone || ""
)}?text=${encodeURIComponent(

"GUPTA FASHION - Order " +
(order.order_id || "") +
" status: " +
(order.status || "")

)}"

>

WhatsApp

</a>

</td>


<td>

<button

class="delete"

onclick="deleteOrder('${order.id}')"

>

Delete

</button>

</td>

</tr>

`;

}

).join("");

}


/* =====================================================
CHANGE STATUS
===================================================== */

async function changeStatus(
id,
status
){

const {
error
} = await supabaseClient

.from("orders")

.update({
status:status
})

.eq("id",id);


if(error){

console.error(error);

alert(
"Status update nahi hua."
);

return;

}


showOrders();

}


/* =====================================================
DELETE
===================================================== */

async function deleteOrder(id){

if(
!confirm(
"Delete this order?"
)
)
return;


const {
error
} =
await supabaseClient

.from("orders")

.delete()

.eq("id",id);


if(error){

console.error(error);

alert(
"Order delete nahi hua."
);

return;

}


showOrders();

}


/* =====================================================
ESCAPE HTML
===================================================== */

function escapeHtml(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================================
DATE
===================================================== */

function formatDate(value){

if(!value)
return "";

const date =
new Date(value);

if(
Number.isNaN(
date.getTime()
)
)
return "";

return date.toLocaleString(
"en-IN"
);

}


/* =====================================================
START
===================================================== */

showOrders();

</script>

</body>

</html>
