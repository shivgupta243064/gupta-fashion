<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Gupta Fashion - Admin Panel</title>

<link rel="stylesheet" href="style.css">

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

/* ===============================
   ADMIN PAGE
================================ */

.admin-page{
    max-width:1250px;
    margin:30px auto;
    padding:20px;
}


/* ===============================
   HEADER
================================ */

.admin-header{
    background:#111827;
    color:white;

    padding:25px;

    border-radius:20px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:15px;
}


.admin-header h1{
    margin:0 0 5px;
}


.admin-header p{
    margin:0;
    opacity:.7;
}


.admin-header a{
    background:#f59e0b;
    color:#111827;

    padding:12px 18px;

    border-radius:10px;

    text-decoration:none;

    font-weight:bold;

    transition:.2s;
}


.admin-header a:hover{
    transform:translateY(-2px);
}


/* ===============================
   STATS
================================ */

.stats{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:15px;

    margin:20px 0;
}


.stat-card{
    background:white;

    border:1px solid #e5e7eb;

    border-radius:16px;

    padding:22px;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.04);
}


.stat-card small{
    color:#6b7280;
}


.stat-card h2{
    margin-top:8px;
}


/* ===============================
   ORDERS
================================ */

.orders-box{
    background:white;

    border-radius:18px;

    padding:20px;

    border:1px solid #e5e7eb;

    overflow:auto;
}


.orders-box h2{
    margin-top:0;
}


table{
    width:100%;

    min-width:1050px;

    border-collapse:collapse;
}


th,
td{
    padding:13px;

    border-bottom:
        1px solid #e5e7eb;

    text-align:left;

    font-size:13px;

    vertical-align:top;
}


th{
    background:#f9fafb;
}


/* ===============================
   STATUS
================================ */

.status-select{

    padding:9px 12px;

    border-radius:8px;

    border:1px solid #d1d5db;

    background:white;

    cursor:pointer;

    font-weight:600;

}


/* ===============================
   WHATSAPP
================================ */

.wa{

    color:#16a34a;

    font-weight:bold;

    text-decoration:none;

}


.wa:hover{
    text-decoration:underline;
}


/* ===============================
   DELETE
================================ */

.delete{

    border:none;

    background:#fee2e2;

    color:#dc2626;

    padding:8px 10px;

    border-radius:8px;

    cursor:pointer;

    font-weight:600;

}


.delete:hover{
    background:#fecaca;
}


/* ===============================
   REFRESH
================================ */

.refresh-btn{

    border:none;

    background:#111827;

    color:white;

    padding:10px 15px;

    border-radius:10px;

    cursor:pointer;

    margin-bottom:15px;

    transition:.2s;

}


.refresh-btn:hover{
    transform:translateY(-2px);
}


/* ===============================
   EMPTY
================================ */

.empty-orders{

    text-align:center;

    padding:50px;

    color:#6b7280;

}


/* ===============================
   MOBILE
================================ */

@media(max-width:700px){

    .stats{

        grid-template-columns:1fr;

    }


    .admin-page{

        padding:12px;

    }


    .admin-header{

        flex-direction:column;

        align-items:flex-start;

    }

}

</style>

</head>


<body>


<div class="admin-page">


    <!-- HEADER -->

    <div class="admin-header">

        <div>

            <h1>
                📊 Gupta Fashion
            </h1>

            <p>
                Admin Panel
            </p>

        </div>


        <a href="index.html">
            ← Customer Website
        </a>

    </div>



    <!-- STATS -->

    <div class="stats">


        <div class="stat-card">

            <small>
                Total Products
            </small>

            <h2 id="productCount">
                8
            </h2>

        </div>



        <div class="stat-card">

            <small>
                Total Orders
            </small>

            <h2 id="orderCount">
                0
            </h2>

        </div>



        <div class="stat-card">

            <small>
                Total Sales
            </small>

            <h2 id="sales">
                ₹0
            </h2>

        </div>


    </div>



    <!-- ORDERS -->

    <div class="orders-box">


        <h2>
            📦 Customer Orders
        </h2>


        <button
            class="refresh-btn"
            onclick="loadOrders()"
        >
            🔄 Refresh Orders
        </button>


        <table>


            <thead>

                <tr>

                    <th>
                        Order ID
                    </th>

                    <th>
                        Customer
                    </th>

                    <th>
                        Products
                    </th>

                    <th>
                        Total
                    </th>

                    <th>
                        Payment
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        WhatsApp
                    </th>

                    <th>
                        Delete
                    </th>

                </tr>

            </thead>


            <tbody id="orders">

            </tbody>


        </table>


    </div>


</div>



<script>


/* =====================================================
   SUPABASE CONFIG
===================================================== */


const SUPABASE_URL =
    "https://fglsyjbprzitagtfwgpp.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_cdpN6qM5gHiHAzigyYgzfg_AU-Ce_3D";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =====================================================
   STATUS LIST
===================================================== */


const statuses = [

    "New Order",

    "Confirmed",

    "Packed",

    "Out for Delivery",

    "Delivered"

];



/* =====================================================
   MONEY
===================================================== */


function money(n){

    return "₹" +
        Number(n || 0)
            .toLocaleString("en-IN");

}



/* =====================================================
   LOAD ORDERS FROM SUPABASE
===================================================== */


async function loadOrders(){


    const table =
        document.getElementById(
            "orders"
        );


    table.innerHTML = `

        <tr>

            <td
                colspan="8"
                style="
                    text-align:center;
                    padding:40px;
                "
            >

                Loading orders...

            </td>

        </tr>

    `;



    const {
        data,
        error
    } = await supabaseClient

        .from("orders")

        .select("*")

        .order(
            "id",
            {
                ascending:false
            }
        );



    if(error){

        console.error(
            "SUPABASE ERROR:",
            error
        );


        table.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    style="
                        text-align:center;
                        padding:40px;
                        color:red;
                    "
                >

                    ❌ Orders load nahi ho rahe.

                    <br><br>

                    ${error.message}

                </td>

            </tr>

        `;

        return;

    }



    showOrders(data || []);

}



/* =====================================================
   SHOW ORDERS
===================================================== */


function showOrders(orders){


    document.getElementById(
        "orderCount"
    ).textContent =
        orders.length;



    let sales = 0;


    orders.forEach(order => {

        sales +=
            Number(order.total || 0);

    });



    document.getElementById(
        "sales"
    ).textContent =
        money(sales);



    const table =
        document.getElementById(
            "orders"
        );



    if(!orders.length){

        table.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    class="empty-orders"
                >

                    📦

                    <br><br>

                    No orders yet.

                </td>

            </tr>

        `;

        return;

    }



    table.innerHTML =

        orders.map(
            order => {


                let items = [];



                /*

                    Supabase JSON column

                    may return array.

                */


                if(
                    Array.isArray(
                        order.items
                    )
                ){

                    items =
                        order.items;

                }



                const productsHTML =

                    items.length

                    ?

                    items.map(
                        item => `

                            <div>

                                ${item.name}

                                × ${item.qty}

                            </div>

                        `
                    ).join("")

                    :

                    "No product details";



                const phone =
                    String(
                        order.customer_phone || ""
                    ).replace(
                        /\D/g,
                        ""
                    );



                const waNumber =
                    phone.length === 10

                    ?

                    "91" + phone

                    :

                    phone;



                return `

                <tr>


                    <!-- ORDER ID -->

                    <td>

                        <b>
                            ${order.order_id || "-"}
                        </b>

                        <br>

                        <small>

                            ${
                                order.created_at
                                ?

                                new Date(
                                    order.created_at
                                ).toLocaleString(
                                    "en-IN"
                                )

                                :

                                ""

                            }

                        </small>

                    </td>



                    <!-- CUSTOMER -->

                    <td>

                        <b>

                            ${
                                order.customer_name
                                || "-"
                            }

                        </b>

                        <br>

                        📞

                        ${
                            order.customer_phone
                            || "-"
                        }

                        <br><br>

                        ${
                            order.customer_address
                            || ""
                        }

                        <br>

                        ${
                            order.customer_city
                            || ""
                        },

                        ${
                            order.customer_state
                            || ""
                        }

                        -

                        ${
                            order.customer_pincode
                            || ""
                        }

                    </td>



                    <!-- PRODUCTS -->

                    <td>

                        ${productsHTML}

                    </td>



                    <!-- TOTAL -->

                    <td>

                        <b>

                            ${money(
                                order.total
                            )}

                        </b>

                    </td>



                    <!-- PAYMENT -->

                    <td>

                        💵

                        Cash on Delivery

                    </td>



                    <!-- STATUS -->

                    <td>

                        <select

                            class="status-select"

                            onchange="
                                changeStatus(
                                    '${order.order_id}',
                                    this.value
                                )
                            "

                        >

                            ${
                                statuses.map(
                                    status => `

                                    <option

                                        value="${status}"

                                        ${
                                            order.status
                                            ===
                                            status

                                            ?

                                            "selected"

                                            :

                                            ""
                                        }

                                    >

                                        ${status}

                                    </option>

                                `
                                ).join("")
                            }

                        </select>

                    </td>



                    <!-- WHATSAPP -->

                    <td>

                        ${
                            waNumber

                            ?

                            `

                            <a

                                class="wa"

                                target="_blank"

                                href="https://wa.me/${waNumber}?text=${encodeURIComponent(

                                    "GUPTA FASHION\n\n" +

                                    "Order ID: " +
                                    order.order_id +

                                    "\n\n" +

                                    "Your order status is: " +
                                    order.status

                                )}"

                            >

                                WhatsApp

                            </a>

                            `

                            :

                            "-"
                        }

                    </td>



                    <!-- DELETE -->

                    <td>

                        <button

                            class="delete"

                            onclick="
                                deleteOrder(
                                    '${order.order_id}'
                                )
                            "

                        >

                            Delete

                        </button>

                    </td>


                </tr>

                `;

            }

        ).join("");

}



/* =====================================================
   CHANGE STATUS
===================================================== */


async function changeStatus(
    orderId,
    newStatus
){


    const {
        error
    } = await supabaseClient

        .from("orders")

        .update({

            status:
                newStatus

        })

        .eq(
            "order_id",
            orderId
        );



    if(error){

        console.error(
            error
        );


        alert(
            "Status update nahi hua.\n\n" +
            error.message
        );


        return;

    }



    alert(
        "Order status updated:\n" +
        newStatus
    );


    loadOrders();

}



/* =====================================================
   DELETE ORDER
===================================================== */


async function deleteOrder(
    orderId
){


    const confirmDelete =
        confirm(
            "Kya aap is order ko delete karna chahte hain?"
        );


    if(!confirmDelete)
        return;



    const {
        error
    } = await supabaseClient

        .from("orders")

        .delete()

        .eq(
            "order_id",
            orderId
        );



    if(error){

        console.error(
            error
        );


        alert(
            "Order delete nahi hua.\n\n" +
            error.message
        );


        return;

    }



    alert(
        "Order deleted successfully."
    );


    loadOrders();

}



/* =====================================================
   START
===================================================== */


loadOrders();


</script>


</body>

</html>
